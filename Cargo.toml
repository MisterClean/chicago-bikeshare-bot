[package]
name = "chicago-bikeshare-bot"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "chicago-bikeshare-bot"
path = "rust/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15"
fs2 = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
fontdue = "0.9"
prost = "0.14"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
