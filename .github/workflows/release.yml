name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

permissions:
  contents: write
  actions: read
  attestations: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Download the exact bundle tested by main CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-native
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest tested native bundle
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: chicago-bikeshare-bot-linux-x86_64.tar.gz
      - name: Publish versioned release and promote its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$COMMIT"
          asset=chicago-bikeshare-bot-linux-x86_64.tar.gz
          checksum=$(sha256sum "$asset" | cut -d' ' -f1)
          jq -n --arg repository "$GH_REPO" --arg commit "$COMMIT" --arg sha256 "$checksum" --arg asset "$asset" \
            '{repository:$repository,commit:$commit,sha256:$sha256,asset:$asset}' > production.json
          if gh release view "app-$COMMIT" >/dev/null 2>&1; then
            mkdir existing
            gh release download "app-$COMMIT" --pattern production.json --dir existing
            cmp production.json existing/production.json
          else
            gh release create "app-$COMMIT" "$asset" production.json --target "$COMMIT" \
              --title "Native release $COMMIT" --notes "Tested Rust worker and pinned Petit. Persistent state is not included." --latest=false
          fi
          if ! gh release view production >/dev/null 2>&1; then
            gh release create production --target "$COMMIT" --title "Approved production channel" \
              --notes "The host polls production.json and verifies the versioned release checksum." --latest=false
          fi
          gh release upload production production.json --clobber
