name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.94.0
      - name: Formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test Rust worker and deployment safeguards
        run: |
          cargo test --locked
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash -n deploy/run-bot scripts/build-release
      - name: Build native worker and pinned Petit
        run: scripts/build-release
      - name: Smoke-test native bundle and Petit execution
        run: python3 tests/petit_smoke.py dist/bundle/pt
      - name: Upload the tested Linux bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-native
          path: dist/chicago-bikeshare-bot-linux-x86_64.tar.gz
          retention-days: 14
          if-no-files-found: error
