name: Roll back production

on:
  workflow_dispatch:
    inputs:
      target:
        description: Full commit SHA of an existing native app release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Promote a previously published native release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$TARGET" origin/main
          gh release download "app-$TARGET" --pattern production.json
          jq -e --arg commit "$TARGET" --arg repository "$GH_REPO" \
            '.commit == $commit and .repository == $repository' production.json
          gh release upload production production.json --clobber
